<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de Etiquetas · Condor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f3;--card:#fff;--ink:#14171c;--mut:#667085;--line:#d7dbe2;--brand:#111;--ok:#157f3b;--warn:#b45309;--err:#c0262d;--acc:#1d4ed8}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Poppins,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header.top{background:var(--brand);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px}
header.top img{height:26px;filter:invert(1)}
header.top h1{font-size:16px;margin:0;font-weight:600}
.app{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:14px;padding:14px;align-items:start}
@media(max-width:980px){.app{grid-template-columns:1fr}}
.panel{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.card h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px}
button:hover{background:#f4f5f7}
button.pri{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
button.pri:hover{background:#2a2f38}
button.sm{padding:4px 8px}
input,select{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;min-width:0}
input:disabled{background:#f1f2f4;color:#9aa1ad}
label{display:block;font-size:11px;color:var(--mut);margin-bottom:2px}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600}
.chip.ok{background:#dcf5e5;color:var(--ok)}.chip.warn{background:#fdeccf;color:var(--warn)}.chip.err{background:#fbdcde;color:var(--err)}.chip.busy{background:#e4e9f8;color:var(--acc)}
.msg{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.4}
details summary{cursor:pointer;font-size:12px;color:var(--mut);margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.item{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:10px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:#fafbfc;position:relative}
.item .f{grid-column:span 2}
.item .f.w3{grid-column:span 3}
.item .f.w6{grid-column:span 6}
.item .f.w1{grid-column:span 1}
.item .acts{grid-column:span 1;display:flex;gap:4px;align-items:end;justify-content:flex-end}
.hint{font-size:11px;margin-top:2px}.hint.ok{color:var(--ok)}.hint.err{color:var(--err)}.hint.man{color:var(--warn)}
.item.nf input[data-f=desc]{border-color:var(--err);background:#fff5f5}
#preview{padding:0;overflow:auto}
.empty{color:var(--mut);padding:30px;text-align:center}
.wrap{margin:0 auto 14px;position:relative}
.sheet{width:297mm;height:209mm;background:#fff;display:grid;padding:6mm;gap:4mm;overflow:hidden;transform-origin:top left;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.sheet.n1{grid-template:1fr/1fr}
.sheet.n4{grid-template:1fr 1fr/1fr 1fr}
.label{border:1mm solid #000;display:flex;flex-direction:column;overflow:hidden;font-family:Poppins,Arial,sans-serif;color:#000;background:#fff;min-height:0;min-width:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.label>*{min-height:0}
.fit{display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;font-weight:700}
.fit .t{display:block;width:100%;padding:0 2mm;line-height:1.1;font-weight:700}
.fit.nw .t{white-space:nowrap}
.fit:not(.nw) .t{overflow-wrap:anywhere}
.fit.left{justify-content:flex-start}.fit.left .t{text-align:left}
.hd{background:#000;color:#fff;flex:0 0 7%}
.ped{flex:0 0 14%;display:flex;align-items:stretch;border-bottom:.6mm solid #000}
.ped .fit{flex:1}
.ped .logo{height:100%;padding:1.2mm 3mm;display:flex;align-items:center}
.ped .logo img{height:100%;width:auto;max-width:100%;object-fit:contain}
.cod{flex:0 0 24%;border-bottom:.6mm solid #000}
.desc{flex:1 1 0;border-bottom:.6mm solid #000}
.ft{flex:0 0 20%;display:flex}
.ft>.fit{border-left:.6mm solid #000}
.ft>.fit:first-child{border-left:0}
.ft .k{flex:0 0 18%}.ft .v{flex:1 1 0}
.hd2{flex:0 0 17%;display:flex;align-items:stretch;border-bottom:.6mm solid #000}
.hd2 .logo{display:flex;align-items:center;padding:1.5mm 3mm;background:#fff;border-right:.6mm solid #000}
.hd2 .logo img{height:100%;width:auto}
.hd2 .fit{flex:1}
.s-analise .hd2 .fit{background:#ffd54a}.s-liberado .hd2 .fit{background:#5fcf80}.s-reprovado .hd2 .fit{background:#ee5a5a}
.status .cod{flex:0 0 24%}
.status .ft1{flex:0 0 14%;display:flex;border-bottom:.6mm solid #000}
.status .ft1>.fit{border-left:.6mm solid #000}.status .ft1>.fit:first-child{border-left:0}
.status .ft1 .k{flex:0 0 17%}.status .ft1 .v{flex:1 1 0}
.status .ft2{flex:0 0 14%;display:flex}
.status .ft2 .k{flex:0 0 17%}.status .ft2 .v{flex:1 1 0;border-left:.6mm solid #000}
@page{size:A4 landscape;margin:0}
@media print{
  body{background:#fff}
  header.top,.panel{display:none!important}
  .app{display:block;padding:0}
  #preview{overflow:visible}
  .wrap{width:auto!important;height:auto!important;margin:0!important}
  .sheet{transform:none!important;box-shadow:none;break-after:page;page-break-after:always}
  .wrap:last-child .sheet{break-after:auto;page-break-after:auto}
}
</style>
</head>

<main class="app">
  <aside class="panel">
    <div class="card">
      <h2>Base de códigos</h2>
      <div class="row">
        <span id="dbchip" class="chip busy">Carregando…</span>
        <button id="btnReload" class="sm">↻ Atualizar da planilha</button>
        <button id="btnFile" class="sm">Carregar arquivo…</button>
        <input type="file" id="fileIn" accept=".xlsx,.xls,.csv" hidden>
      </div>
      <div id="dbmsg" class="msg"></div>
      <details>
        <summary>Configurar planilha</summary>
        <div class="grid2">
          <div><label>ID da planilha Google</label><input id="cfgId"></div>
          <div><label>Nome da aba com os códigos</label><input id="cfgSheet"></div>

        <div class="msg">A planilha precisa estar compartilhada como <b>“Qualquer pessoa com o link → Leitor”</b>. Coluna A = código, coluna B = descrição.</div>
      </details>
    </div>

    <div class="card">
      <h2>Impressão</h2>
      <div class="grid2" style="margin-top:0">
        <div><label>Etiquetas por folha (A4 paisagem)</label>
          <select id="perSheet"><option value="1">1 etiqueta grande</option><option value="4">4 etiquetas (2×2)</option></select></div>
        <div><label>Texto do rótulo do código</label><input id="cfgPedido"></div>
      </div>

        <button id="btnPrint" class="pri">🖨 Imprimir / Salvar PDF</button>
        <span id="sum" class="msg" style="margin:0"></span>
      </div>
    </div>

    <div class="card">
      <h2>Etiquetas</h2>

      <div class="row">
        <button id="btnAdd" class="pri">+ Adicionar etiqueta</button>
        <button id="btnClear">Limpar tudo</button>
      </div>
    </div>
  </aside>

const TIPOS={ident:'Identificação',analise:'Análise',liberado:'Liberado',reprovado:'Reprovado'};

/* ---------- storage ---------- */
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const cfg=Object.assign({sheetId:'1yen94HF3nCHyDwa81Awqkv0cEqAqTByN8wMYQ9UxqHo',sheetName:'BANCO_DADOS',perSheet:1,pedido:'Pedido:'},JSON.parse(ls.get('etq_cfg')||'{}'));
const saveCfg=()=>ls.set('etq_cfg',JSON.stringify(cfg));

/* ---------- base de dados ---------- */
let DB={exact:new Map(),loose:new Map(),count:0};
const nk=s=>String(s==null?'':s).trim().toUpperCase().replace(/\s+/g,'');
function buildDB(rows){
  const ex=new Map(),lo=new Map();
  for(const r of rows){
    const k=nk(r[0]); if(!k) continue;
    const d=String(r[1]==null?'':r[1]).trim();
    if(!ex.has(k)) ex.set(k,d);              // 1ª ocorrência vence (igual ao PROCV)
    const l=k.replace(/^0+/,'');
    if(l&&!lo.has(l)) lo.set(l,d);
  }
  DB={exact:ex,loose:lo,count:ex.size};
}
function lookup(code){
  const k=nk(code); if(!k) return null;
  if(DB.exact.has(k)) return DB.exact.get(k);
  const l=k.replace(/^0+/,'');
  return DB.loose.has(l)?DB.loose.get(l):null;
}
function parseCSV(t,delim){
  if(!delim){const first=t.split(/\r?\n/,1)[0]||'';delim=(first.includes(';')&&!first.includes(','))?';':','}
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"') q=true;
    else if(c===delim){r.push(f);f=''}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n')i++; r.push(f);f='';rows.push(r);r=[] }
    else f+=c;
  }
  if(f!==''||r.length){r.push(f);rows.push(r)}
  return rows.map(x=>[x[0],x[1]]).filter(x=>x[0]&&String(x[0]).trim());
}
function setStatus(cls,txt,msg){
  const c=document.getElementById('dbchip'); c.className='chip '+cls; c.textContent=txt;
  document.getElementById('dbmsg').innerHTML=msg||'';
}
const fmtN=n=>n.toLocaleString('pt-BR');
function cacheSave(rows){ls.set('etq_db',JSON.stringify(rows));ls.set('etq_db_at',new Date().toISOString())}
function afterDB(){
  items.forEach(it=>{ if(!it.descManual) autoDesc(it); });
  renderItems(); schedulePreview(); saveItems();
}
async function loadSheet(){
  setStatus('busy','Atualizando…','Buscando a planilha no Google…');
  try{
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),25000);
    const url='https://docs.google.com/spreadsheets/d/'+encodeURIComponent(cfg.sheetId)+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(cfg.sheetName);
    const r=await fetch(url,{signal:ctl.signal}); clearTimeout(to);
    const txt=await r.text();
    if(!r.ok||/^\s*<(!doctype|html)/i.test(txt)) throw new Error('acesso negado');
    const rows=parseCSV(txt,',');
    if(!rows.length) throw new Error('aba vazia ou nome da aba incorreto');
    buildDB(rows); cacheSave(rows);
    setStatus('ok','✔ Planilha Google · '+fmtN(DB.count)+' códigos','Atualizada agora ('+new Date().toLocaleTimeString('pt-BR')+').');
    afterDB(); return true;
  }catch(e){
    return false;
  }
}
async function loadFallback(){
  // 1) cache do navegador  2) banco_dados.json ao lado do index.html
  const c=ls.get('etq_db');
  if(c){ try{ buildDB(JSON.parse(c)); const at=ls.get('etq_db_at'); return 'cache'+(at?' de '+new Date(at).toLocaleString('pt-BR'):''); }catch(e){} }
  try{
    const r=await fetch('banco_dados.json',{cache:'no-cache'}); if(!r.ok) throw 0;
    buildDB(await r.json()); return 'banco_dados.json';
  }catch(e){}
  return null;
}
async function boot(){
  const fb=await loadFallback();
  if(fb){ setStatus('warn','Cópia local · '+fmtN(DB.count)+' códigos','Usando '+fb+'. Tentando atualizar da planilha…'); afterDB(); }
  const ok=await loadSheet();
  if(!ok){
    if(fb) setStatus('warn','Cópia local · '+fmtN(DB.count)+' códigos','Não consegui ler a planilha Google (verifique se está compartilhada como “Qualquer pessoa com o link → Leitor”). Usando '+fb+'.');
    else setStatus('err','Sem base de códigos','Não consegui ler a planilha Google. Compartilhe-a como “Qualquer pessoa com o link → Leitor” ou use <b>Carregar arquivo…</b>. Você ainda pode digitar as descrições manualmente.');
  }
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function loadFile(file){
  try{
    setStatus('busy','Lendo arquivo…','');
    let rows;
    if(/\.csv$/i.test(file.name)) rows=parseCSV(await file.text());
    else{
      if(!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
      const ws=wb.Sheets[cfg.sheetName]||wb.Sheets[wb.SheetNames[0]];
      rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true}).map(r=>[r[0],r[1]]).filter(r=>r[0]!=null&&String(r[0]).trim());
    }
    if(!rows.length) throw new Error('nenhuma linha encontrada');
    buildDB(rows); cacheSave(rows);
    setStatus('ok','✔ Arquivo · '+fmtN(DB.count)+' códigos','Base carregada de <b>'+esc(file.name)+'</b>.');
    afterDB();
  }catch(e){ setStatus('err','Falha ao ler o arquivo',esc(e.message||String(e))) }
}

/* ---------- itens ---------- */
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?m[3]+'/'+m[2]+'/'+m[1]:(s||'')};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items=[];
try{items=JSON.parse(ls.get('etq_items')||'[]')}catch(e){items=[]}
function newItem(base){return Object.assign({id:uid(),tipo:'ident',codigo:'',desc:'',descManual:false,found:null,lote:'',nfe:'',data:today(),copias:1},base||{})}
if(!items.length) items=[newItem()];
const saveItems=()=>ls.set('etq_items',JSON.stringify(items));
const find=id=>items.find(i=>i.id===id);

function autoDesc(it){
  if(!it.codigo.trim()){it.desc='';it.found=null;return}
  const r=lookup(it.codigo);
  it.found=r!==null; it.desc=r===null?NF:r;
}
function hintHTML(it){
  if(it.descManual) return '<span class="hint man">editada manualmente</span>';
  if(!it.codigo.trim()) return '';
  return it.found?'<span class="hint ok">✔ encontrada na base</span>':'<span class="hint err">✖ código não encontrado — digite a descrição</span>';
}
function renderItems(){
  const box=document.getElementById('items');
  box.innerHTML=items.map(it=>`
  <div class="item ${(!it.descManual&&it.found===false)?'nf':''}" data-id="${it.id}">
    <div class="f"><label>Tipo</label><select data-f="tipo">${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}" ${it.tipo===k?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="f w3"><label>Código</label><input data-f="codigo" value="${esc(it.codigo)}" placeholder="ex.: 20814002601" autocomplete="off"></div>
    <div class="f w1"><label>Cópias</label><input data-f="copias" type="number" min="1" max="99" value="${it.copias}"></div>
    <div class="f w6"><label>Descrição</label><input data-f="desc" value="${esc(it.desc)}" placeholder="preenchida automaticamente pelo código"><div class="hint-box">${hintHTML(it)}</div></div>
    <div class="f"><label>Lote</label><input data-f="lote" value="${esc(it.lote)}"></div>
    <div class="f"><label>NFe</label><input data-f="nfe" value="${esc(it.nfe)}" ${it.tipo==='ident'?'disabled placeholder="só Análise/Liberado/Reprovado"':''}></div>
    <div class="f"><label>Data</label><input data-f="data" type="date" value="${esc(it.data)}"></div>
    <div class="f w6 acts" style="justify-content:flex-end"><button class="sm" data-act="dup" title="Duplicar">⧉ Duplicar</button><button class="sm" data-act="del" title="Remover">✕ Remover</button></div>
  </div>`).join('');
}
const itemsBox=document.getElementById('items');
itemsBox.addEventListener('input',e=>{
  const el=e.target,f=el.dataset.f; if(!f) return;
  const row=el.closest('.item'),it=find(row.dataset.id); if(!it) return;
  if(f==='copias') it.copias=Math.max(1,Math.min(99,parseInt(el.value,10)||1));
  else it[f]=el.value;
  if(f==='codigo'){
    if(!it.descManual) autoDesc(it);
    row.querySelector('[data-f=desc]').value=it.desc;
  }
  if(f==='desc'){
    if(el.value===''){ it.descManual=false; autoDesc(it); el.value=it.desc; }
    else it.descManual=true;
  }
  if(f==='codigo'||f==='desc'){
    row.classList.toggle('nf',!it.descManual&&it.found===false);
    row.querySelector('.hint-box').innerHTML=hintHTML(it);
  }
  saveItems(); schedulePreview();
});
itemsBox.addEventListener('change',e=>{ if(e.target.dataset.f==='tipo'){ renderItems(); } });
itemsBox.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const id=b.closest('.item').dataset.id,i=items.findIndex(x=>x.id===id);
  if(b.dataset.act==='del'){ items.splice(i,1); if(!items.length) items.push(newItem()); }
  if(b.dataset.act==='dup'){ items.splice(i+1,0,Object.assign({},items[i],{id:uid()})); }
  renderItems(); saveItems(); schedulePreview();
});
document.getElementById('btnAdd').onclick=()=>{
  const last=items[items.length-1];
  items.push(newItem(last?{tipo:last.tipo,data:last.data,lote:last.lote}:null));
  renderItems(); saveItems(); schedulePreview();
  const rows=itemsBox.querySelectorAll('.item'); const r=rows[rows.length-1];
  r.scrollIntoView({block:'nearest'}); r.querySelector('[data-f=codigo]').focus();
};
document.getElementById('btnClear').onclick=()=>{
  if(!confirm('Remover todas as etiquetas da lista?')) return;
  items=[newItem()]; renderItems(); saveItems(); schedulePreview();
};

/* ---------- configurações ---------- */
const $=id=>document.getElementById(id);
$('cfgId').value=cfg.sheetId; $('cfgSheet').value=cfg.sheetName; $('perSheet').value=String(cfg.perSheet); $('cfgPedido').value=cfg.pedido;
$('cfgId').onchange=e=>{const v=e.target.value.trim();const m=/\/d\/([a-zA-Z0-9_-]+)/.exec(v);cfg.sheetId=m?m[1]:v;e.target.value=cfg.sheetId;saveCfg();loadSheet()};
$('cfgSheet').onchange=e=>{cfg.sheetName=e.target.value.trim()||'BANCO_DADOS';saveCfg();loadSheet()};
$('perSheet').onchange=e=>{cfg.perSheet=+e.target.value;saveCfg();schedulePreview()};
$('cfgPedido').oninput=e=>{cfg.pedido=e.target.value;saveCfg();schedulePreview()};
$('btnReload').onclick=async()=>{ if(!(await loadSheet())) setStatus('err','Falha ao atualizar','Não consegui ler a planilha Google. Confirme o compartilhamento (“Qualquer pessoa com o link → Leitor”) e o nome da aba.'); };
$('btnFile').onclick=()=>$('fileIn').click();
$('fileIn').onchange=e=>{ if(e.target.files[0]) loadFile(e.target.files[0]); e.target.value=''; };
$('btnPrint').onclick=()=>window.print();

/* ---------- etiquetas ---------- */
function T(cls,txt,max,extra){ // texto com ajuste automático
  return `<div class="fit ${cls}" data-max="${max}"${extra||''}><span class="t">${esc(txt)}</span></div>`;
}
function labelHTML(it){
  const data=fmtDate(it.data);
  if(it.tipo==='ident'){
    return `<div class="label ident">
      ${T('hd nw','ETIQUETA DE IDENTIFICAÇÃO',.05)}
      <div class="ped">${T('nw left',cfg.pedido,.085)}<div class="logo"><img src="${LOGO}" alt=""></div></div>
      ${T('cod nw',it.codigo,.2)}
      ${T('desc',it.desc,.115)}
      <div class="ft">${T('k nw','DATA:',.07)}${T('v nw',data,.085)}${T('k nw','LOTE:',.07)}${T('v nw',it.lote,.085)}</div>
    </div>`;
  }
  return `<div class="label status s-${it.tipo}">
    <div class="hd2"><div class="logo"><img src="${LOGO}" alt=""></div>${T('nw',STATUS_TXT[it.tipo],.11)}</div>
    ${T('cod nw',it.codigo,.2)}
    ${T('desc',it.desc,.115)}
    <div class="ft1">${T('k nw','NFe:',.07)}${T('v nw',it.nfe,.08)}${T('k nw','LOTE:',.07)}${T('v nw',it.lote,.08)}</div>
    <div class="ft2">${T('k nw','DATA:',.07)}${T('v nw',data,.08)}</div>
  </div>`;
}
function fitEl(el){
  const t=el.firstElementChild; if(!t) return;
  const label=el.closest('.label'); const H=label.clientHeight;
  if(!t.textContent.trim()){return}
  let lo=5,hi=Math.max(8,H*parseFloat(el.dataset.max));
  const ok=s=>{t.style.fontSize=s+'px';return t.scrollWidth<=el.clientWidth+1&&t.offsetHeight<=el.clientHeight+1};
  if(ok(hi)) return;
  for(let i=0;i<14;i++){const mid=(lo+hi)/2; if(ok(mid)) lo=mid; else hi=mid}
  t.style.fontSize=lo+'px';
}
function fitAll(){ document.querySelectorAll('#preview .fit').forEach(fitEl) }
function scaleSheets(){
  const pv=$('preview'); const avail=pv.clientWidth-2;
  pv.querySelectorAll('.wrap').forEach(w=>{
    const s=w.firstElementChild; const sw=s.offsetWidth,sh=s.offsetHeight;
    const k=Math.min(1,avail/sw);
    s.style.transform='scale('+k+')'; w.style.width=sw*k+'px'; w.style.height=sh*k+'px';
  });
}
let pending=false;
function schedulePreview(){ if(pending) return; pending=true; requestAnimationFrame(()=>{pending=false;renderPreview()}) }
function renderPreview(){
  const list=[]; items.forEach(it=>{ if(!(it.codigo||it.desc||it.lote)) return; for(let i=0;i<it.copias;i++) list.push(it) });
  const n=cfg.perSheet, pv=$('preview');
  $('sum').textContent=list.length?(list.length+' etiqueta(s) · '+Math.ceil(list.length/n)+' folha(s)'):'';
  if(!list.length){ pv.innerHTML='<div class="empty">Digite um código para ver a etiqueta aqui.</div>'; return }
  let html='';
  for(let i=0;i<list.length;i+=n){
    html+=`<div class="wrap"><div class="sheet n${n}">${list.slice(i,i+n).map(labelHTML).join('')}</div></div>`;
  }
  pv.innerHTML=html; scaleSheets(); fitAll();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{fitAll()});
}
window.addEventListener('resize',scaleSheets);
window.addEventListener('beforeprint',()=>{fitAll()});

/* ---------- start ---------- */
renderItems(); renderPreview(); boot();
</script>
</body>
</html>
